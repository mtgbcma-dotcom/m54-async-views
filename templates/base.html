<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Contador de tempo{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f8; color: #273746; font-family: Arial, sans-serif; line-height: 1.6; }
        .container { width: min(760px, 90%); margin: 0 auto; }
        header { background: #234d64; padding: 22px 0; }
        header a { color: white; font-weight: bold; font-size: 22px; text-decoration: none; }
        main { padding: 35px 0; }
        h1 { font-size: 30px; line-height: 1.3; }
        .painel { background: white; border: 1px solid #dce3e8; border-radius: 6px; padding: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 110px; padding: 10px; font-size: 17px; border: 1px solid #869aa7; border-radius: 4px; }
        button, .botao { display: inline-block; background: #234d64; color: white; border: 0; border-radius: 4px; padding: 11px 18px; font-size: 16px; cursor: pointer; text-decoration: none; }
        form button { margin-left: 8px; }
        .tempo { color: #234d64; font-size: 32px; font-weight: bold; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; border-bottom: 1px solid #dce3e8; text-align: left; }
        th { background: #eef3f6; }
        .nota { color: #536878; font-size: 14px; }
        footer { border-top: 1px solid #dce3e8; padding: 20px 0; color: #536878; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #cd8d27; outline-offset: 3px; }
    </style>
</head>
<body>
    <header><div class="container"><a href="{% url 'inicio' %}">Contador de tempo</a></div></header>
    <main class="container">{% block conteudo %}{% endblock %}</main>
    <footer><div class="container">Bruno Macedo</div></footer>
</body>
</html>
